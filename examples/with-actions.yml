name: Actions Smoke

on: [push]

jobs:
  checkout-and-node:
    name: Checkout and Node
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show what we got
        run: |
          echo "workspace: $PWD"
          ls -la | head -8
          echo "github.repository = ${{ github.repository }}"
          echo "github.sha        = ${{ github.sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove node works
        run: |
          node --version
          node -e "console.log('node ran inside orrery')"
